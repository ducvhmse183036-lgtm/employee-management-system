spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=employee_management;encrypt=true;trustServerCertificate=true
spring.datasource.username=employee_app
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload.employee-photo-dir=uploads/employee-photos

spring.jpa.hibernate.ddl-auto=none